
name: Build Predictive Input Buffer for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build iOS mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          use-lto: false
          configure-args: "-DCMAKE_APPLE_ARCH_SYSROOTS= -DCMAKE_OSX_SYSROOT=iphoneos"

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Input-Buffer-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
