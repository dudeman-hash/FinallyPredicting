
name: Build Predictive Input Buffer for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build iOS mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: 5.11.2
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF
          use-lto: false

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Input-Buffer-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
