
name: Build iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.11.2
          target: iOS
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF
          use-lto: false

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictive-input-buffer-ios
          path: build/*.geode
